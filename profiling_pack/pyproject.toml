[project]
name = "profiling-pack"
version = "1.1.0"
description = "Pack profiling gives general information about the source"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "qalita-core>=2.0.0",
    "polars>=1.37.1",
    "pyarrow>=23.0.1",
    "openpyxl>=3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
