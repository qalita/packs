[project]
name = "data-compare-pack"
version = "1.1.0"
description = "Pack data-compare compare 2 sources"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "qalita-core>=2.1.1",
    # Declared explicitly rather than inherited from qalita-core: this pack
    # calls polars directly, and it needs the streaming engine (>=1.25) and the
    # `nulls_equal` join argument (>=1.24).
    "polars>=1.31,<2",
    "pyarrow>=23.0.1",
    # Mismatches report writer. datacompy and pandas are no longer used:
    # datacompy.PolarsCompare rejects LazyFrames and joins eagerly.
    "openpyxl>=3.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
