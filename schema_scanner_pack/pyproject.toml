[project]
name = "schema-scanner-pack"
version = "2.0.0"
description = "Scan schema for files"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Proprietary"}
readme = "README.md"
# The profiling stack removed in 3.0.0 is what pinned this pack
# below Python 3.13.
requires-python = ">=3.10,<4.0"
dependencies = [
    "openpyxl>=3.1.2",
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "qalita-core>=2.1.1",
    "polars>=1.37.0",
    "pyarrow>=23.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
