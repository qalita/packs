[project]
name = "data-drift-pack"
version = "0.2.0"
description = "Monitors distribution drift between reference and current datasets (PSI + binned KS)"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "qalita-core>=2.1.1",
    "polars>=1.0.0",
    "pyarrow>=23.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
