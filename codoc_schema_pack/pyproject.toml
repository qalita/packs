[project]
name = "codoc-schema-pack"
version = "0.1.0"
description = "Checks that a source conforms to the codoc data model"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "qalita-core>=2.1.1",
    "pyarrow>=23.0.1",
    # Same bounds as omop_cdm_pack: below 1.25 `collect(engine="streaming")`
    # silently runs the in-memory engine; 2.0 is an untested major.
    "polars>=1.30,<2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
