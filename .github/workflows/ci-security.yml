name: "CI: Security Scan"

on: [push, pull_request]

# Minimal permissions following least privilege principle
permissions:
  contents: read
  actions: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.96.0
