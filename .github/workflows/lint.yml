name: Security Scan

on: [push, pull_request]

# Minimal permissions following least privilege principle
permissions:
  contents: read
  actions: read

jobs:
  secrets_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.92.5
