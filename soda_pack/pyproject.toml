[project]
name = "soda-pack"
version = "1.1.0"
description = "Check validity format for soda"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
# Capped at <3.13 by duckdb, not by anything in this pack: soda-core-duckdb
# 3.5.6 pins duckdb<1.1.0, and no duckdb below 1.1.0 publishes a cp313 wheel
# (cp313 first appears in 1.1.1). The worker image carries no compiler, so the
# source build that follows cannot succeed — the cap makes the runner pick the
# 3.12 the image ships. Lift it once soda-core releases the relaxation already
# merged upstream (sodadata/soda-core#2527, duckdb>=1.1.0,<2.0); the v3 branch
# still reports 3.5.6, so it is not on PyPI yet.
requires-python = ">=3.11,<3.13"
dependencies = [
    "qalita-core>=2.0.0",
    "pyarrow>=23.0.1",
    "soda-core>=3.5.5",
    # Replaces soda-core-pandas-dask: that plugin's only entry point,
    # scan.add_pandas_dataframe, needs the whole dataset materialized as a
    # pandas frame before dask sees it. The DuckDB plugin runs the same
    # SodaCL checks as SQL, out-of-core. pandas and dask leave with it.
    "soda-core-duckdb>=3.5.5",
    # Transitively available through qalita-core, declared here because this
    # pack executes its checks in DuckDB rather than merely reading parquet.
    # soda-core-duckdb currently caps this at <1.1.0.
    "duckdb>=0.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
