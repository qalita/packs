[project]
name = "accuracy-pack"
version = "2.1.0"
description = "Compute accuracy metrics of source"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "qalita-core>=2.1.1",
    # Declared explicitly rather than inherited from qalita-core: this pack
    # calls polars directly and needs the streaming engine (>=1.25).
    "polars>=1.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
