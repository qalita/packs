[project]
name = "omop-cdm-pack"
version = "0.1.0"
description = "Evaluates an OMOP CDM instance against the OHDSI Data Quality Dashboard check suite"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "qalita-core>=1.5.0",
    "pyarrow>=23.0.1",
    # Upper-bounded: Polars 2.0 removes String->Date casting and the
    # deprecated dtype-set constants this pack works around, and
    # changes streaming-engine behaviour. Widen only with a run of
    # the suite against the new major.
    "polars>=1.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
