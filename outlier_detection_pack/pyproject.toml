[project]
name = "outlier_detection-pack"
version = "3.0.0"
description = "outlier_detection pack"
authors = [
    {name = "QALITA SAS", email = "contact@qalita.io"}
]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
# pyod / scikit-learn / numpy / pandas / seaborn / statsmodels / xlsxwriter are
# gone with the KNN detector and the Excel export. scikit-learn was never even
# declared here: it only ever resolved transitively through pyod, so a pyod
# release that dropped it would have broken this pack at runtime.
dependencies = [
    "qalita-core>=2.1.1",
    "polars>=1.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
